  <script>
    (function () {
      var id = 'G-68T1ZEGEJX';
      try {
        var consent = localStorage.getItem('icg-analytics-consent');
        var dnt = navigator.doNotTrack || window.doNotTrack || navigator.msDoNotTrack;
        var gpc = navigator.globalPrivacyControl === true;
        if (consent !== 'granted' || dnt === '1' || dnt === 'yes' || gpc) window['ga-disable-' + id] = true;
      } catch (e) {
        window['ga-disable-' + id] = true;
      }
      try {
        var stored = localStorage.getItem('icg-language') || '';
        var lang = 'en';
        if (stored === 'en' || stored === 'zh-Hans' || stored === 'zh-Hant' || stored === 'ko' || stored === 'hi') lang = stored;
        else if (stored === 'zh' || stored === 'zh-CN' || stored === 'zh-cn') lang = 'zh-Hans';
        else if (stored === 'zh-TW' || stored === 'zh-HK' || stored === 'zh-Hant') lang = 'zh-Hant';
        else {
          var list = navigator.languages || [navigator.language || 'en'];
          var l0 = String(list[0] || 'en').toLowerCase();
          if (l0.indexOf('zh-tw') === 0 || l0.indexOf('zh-hk') === 0 || l0.indexOf('zh-mo') === 0 || l0.indexOf('zh-hant') === 0) lang = 'zh-Hant';
          else if (l0.indexOf('zh') === 0) lang = 'zh-Hans';
          else if (l0.indexOf('ko') === 0) lang = 'ko';
          else if (l0.indexOf('hi') === 0) lang = 'hi';
        }
        document.documentElement.lang = lang;
      } catch (e2) {}
    })();
